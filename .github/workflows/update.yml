name: Update archive

on:
  schedule:
    # Daily. New episodes are recorded Tuesday afternoons (Pacific) and appear on grc.com soon after.
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-archive
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install pdfimages and xmllint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils libxml2-utils

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Rebuild feed
        # GitHub Pages hostnames are lowercase; keep URLs stable between runs.
        run: |
          owner="${OWNER,,}"
          PUBLIC_BASE_URL="https://${owner}.github.io/${REPO}" node dist/index.js
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}

      - name: Check the feed is well-formed XML
        run: xmllint --noout docs/feed.xml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update archive: $(date -u +%Y-%m-%d)"
            git push
          fi
